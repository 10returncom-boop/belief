<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聖經寶藏庫 · 高級互動聖經網站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101422'/%3E%3Cpath d='M32 14l14 8v14c0 9-6 14-14 17-8-3-14-8-14-17V22z' fill='none' stroke='%23c9a45c' stroke-width='3'/%3E%3Cpath d='M32 20v28M32 20c-3-2-7-3-10-3v28c3 0 7 1 10 3 3-2 7-3 10-3V17c-3 0-7 1-10 3z' fill='%23c9a45c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap">
<style>
/* ================= 設計 Token ================= */
:root{
  --bg:#0e1220;            /* 深邃墨藍 */
  --bg2:#131a2e;
  --card:#1a2340;
  --card2:#212b4d;
  --ink:#eef0f7;           /* 主文字 */
  --ink-dim:#aab3c9;
  --ink-faint:#79829b;
  --gold:#c9a45c;          /* 鎏金主強調 */
  --gold-soft:#e3c888;
  --gold-dim:#8a7440;
  --line:rgba(201,164,92,.18);
  --line2:rgba(255,255,255,.07);
  --serif:"Noto Serif TC",serif,"PMingLiU","Songti TC",serif;
  --sans:"Noto Sans TC",sans-serif,"Microsoft JhengHei","PingFang TC",sans-serif;
  --radius:14px;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --shadow-sm:0 6px 20px rgba(0,0,0,.3);
  --grad:linear-gradient(135deg,#c9a45c 0%,#e8cf96 45%,#a8863f 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1100px 500px at 85% -10%,rgba(201,164,92,.09),transparent 60%),
    radial-gradient(900px 500px at -10% 20%,rgba(60,80,150,.12),transparent 55%);
  background-attachment:fixed;min-height:100vh;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%;display:block}
::selection{background:var(--gold);color:#0e1220}

/* 捲軸 */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2a3458;border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--gold-dim)}

/* ================= 佈局 ================= */
.app{display:flex;min-height:100vh}
.sidebar{
  width:258px;flex:none;background:linear-gradient(180deg,rgba(19,26,46,.96),rgba(14,18,32,.98));
  border-right:1px solid var(--line2);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;z-index:50;
}
.sidebar .brand{
  padding:26px 24px 18px;border-bottom:1px solid var(--line2);
  display:flex;gap:13px;align-items:center;
}
.brand .logo{width:44px;height:44px;flex:none;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.brand .logo svg{width:24px;height:24px}
.brand .bt{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:1px;line-height:1.3}
.brand .bt small{display:block;font-family:var(--sans);font-size:10.5px;color:var(--gold-soft);letter-spacing:2.5px;font-weight:500}

.nav{flex:1;padding:18px 14px;overflow-y:auto}
.nav .navlabel{font-size:11px;letter-spacing:2px;color:var(--ink-faint);padding:12px 12px 7px;font-weight:600}
.nav a{
  display:flex;align-items:center;gap:12px;padding:10.5px 12px;border-radius:10px;
  color:var(--ink-dim);font-size:14.5px;font-weight:500;transition:.18s;margin-bottom:2px;
}
.nav a svg{width:18px;height:18px;flex:none;color:var(--gold-dim);transition:.18s}
.nav a:hover{background:rgba(255,255,255,.05);color:var(--ink)}
.nav a:hover svg{color:var(--gold-soft)}
.nav a.active{background:linear-gradient(90deg,rgba(201,164,92,.18),rgba(201,164,92,.04));color:var(--gold-soft);box-shadow:inset 2px 0 0 var(--gold)}
.nav a.active svg{color:var(--gold-soft)}

.sidebar .foot{padding:16px 22px;border-top:1px solid var(--line2);font-size:12px;color:var(--ink-faint);line-height:1.6}
.sidebar .foot b{color:var(--gold-dim);font-weight:600}

/* 主內容 */
.main{flex:1;min-width:0}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:14px 26px;background:rgba(14,18,32,.82);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line2);
}
.topbar .mobilemenu{display:none;width:40px;height:40px;border-radius:9px;place-items:center;background:var(--card);color:var(--gold-soft)}
.topbar .crumb{font-family:var(--serif);font-size:15.5px;color:var(--ink-dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumb b{color:var(--gold-soft);font-weight:600}

/* 快速跳轉下拉 */
.quickjump{display:flex;gap:9px;align-items:center}
.quickjump .qwrap{position:relative}
.qj-btn{
  display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;
  background:var(--card);border:1px solid var(--line2);color:var(--ink);
  font-size:13.5px;font-weight:500;transition:.18s;min-width:128px;justify-content:space-between;
}
.qj-btn:hover{border-color:var(--line);color:var(--gold-soft)}
.qj-btn .caret{width:12px;height:12px;transition:.2s}
.qwrap.open .qj-btn .caret{transform:rotate(180deg)}
.qj-menu{
  position:absolute;top:calc(100% + 8px);left:0;width:238px;max-height:420px;overflow-y:auto;
  background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);
  opacity:0;visibility:hidden;transform:translateY(-6px);transition:.18s;z-index:60;padding:6px;
}
.qwrap.open .qj-menu{opacity:1;visibility:visible;transform:translateY(0)}
.qj-menu .qj-group{font-size:11px;letter-spacing:1.5px;color:var(--ink-faint);padding:9px 10px 5px;font-weight:600}
.qj-menu .qj-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:13.5px;color:var(--ink-dim);cursor:pointer;transition:.14s}
.qj-menu .qj-item:hover{background:rgba(201,164,92,.12);color:var(--gold-soft)}
.qj-menu .qj-item .qj-ch{color:var(--gold-dim);font-size:11.5px;margin-left:auto}
.qj-chapters{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px}
.qj-chapters .c{text-align:center;padding:7px 0;border-radius:7px;background:rgba(255,255,255,.04);font-size:12.5px;color:var(--ink-dim);cursor:pointer;transition:.12s}
.qj-chapters .c:hover{background:var(--gold);color:#0e1220;font-weight:600}

.content{padding:34px 26px 70px;max-width:1180px;margin:0 auto}

/* 視圖切換 */
.view{display:none}
.view.on{display:block;animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ================= 首頁 Hero ================= */
.hero{
  position:relative;border-radius:var(--radius);overflow:hidden;padding:64px 52px;
  background:linear-gradient(135deg,#171f3a 0%,#0e1220 60%,#141a2e 100%);
  border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:34px;
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(700px 340px at 12% 0%,rgba(201,164,92,.16),transparent 60%),
    radial-gradient(500px 300px at 90% 100%,rgba(201,164,92,.08),transparent 60%);
}
.hero .h-kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:3px;color:var(--gold-soft);font-weight:600;text-transform:uppercase;margin-bottom:18px;position:relative}
.hero .h-kicker::before{content:"";width:26px;height:1px;background:var(--gold)}
.hero h1{font-family:var(--serif);font-size:clamp(30px,4.4vw,50px);font-weight:900;line-height:1.25;position:relative;letter-spacing:1px}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .h-sub{margin-top:18px;color:var(--ink-dim);max-width:620px;font-size:16px;line-height:1.9;position:relative}
.hero .h-stats{display:flex;gap:38px;margin-top:32px;position:relative;flex-wrap:wrap}
.hero .h-stat b{font-family:var(--serif);font-size:30px;font-weight:900;color:var(--gold-soft)}
.hero .h-stat span{display:block;font-size:12.5px;color:var(--ink-faint);letter-spacing:1px}

/* ================= 區塊標題 ================= */
.sect-head{display:flex;align-items:flex-end;justify-content:space-between;margin:38px 0 18px;gap:14px}
.sect-head h2{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:.5px}
.sect-head h2 small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-faint);font-weight:400;margin-top:4px;letter-spacing:1px}
.sect-head .more{font-size:13px;color:var(--gold-soft);display:flex;align-items:center;gap:6px}

/* ================= 通用卡片 / 按鈕 ================= */
.card{background:var(--card);border:1px solid var(--line2);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;
  border-radius:10px;font-size:14px;font-weight:600;transition:.18s;border:1px solid var(--line2);
}
.btn-gold{background:var(--grad);color:#0e1220;border:none;box-shadow:0 6px 20px rgba(201,164,92,.3)}
.btn-gold:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.03);color:var(--ink)}
.btn-ghost:hover{border-color:var(--line);color:var(--gold-soft)}
.btn-line{border-color:var(--line);color:var(--gold-soft);background:rgba(201,164,92,.06)}
.btn-line:hover{background:rgba(201,164,92,.14)}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:8px}

/* ================= 書卷導覽 ================= */
.books-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.books-filter button{padding:7px 15px;border-radius:30px;font-size:13px;color:var(--ink-dim);border:1px solid var(--line2);transition:.15s;background:transparent}
.books-filter button:hover{color:var(--gold-soft);border-color:var(--line)}
.books-filter button.on{background:var(--grad);color:#0e1220;border:none;font-weight:700}
.bk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.bk-card{
  background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:18px 18px 16px;
  cursor:pointer;transition:.2s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:8px;
}
.bk-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);opacity:0;transition:.2s}
.bk-card:hover{transform:translateY(-4px);border-color:var(--line);box-shadow:var(--shadow-sm)}
.bk-card:hover::before{opacity:1}
.bk-card .bk-no{font-size:11px;color:var(--ink-faint);letter-spacing:1px;font-weight:600}
.bk-card .bk-name{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--ink)}
.bk-card .bk-en{font-size:11.5px;color:var(--gold-dim);letter-spacing:1px}
.bk-card .bk-meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:12px;color:var(--ink-faint)}
.bk-card .bk-meta .grp{background:rgba(201,164,92,.1);color:var(--gold-soft);padding:2px 9px;border-radius:20px;font-size:11px}
.bk-card:hover .bk-meta .grp{background:rgba(201,164,92,.2)}
.bk-card .read-ic{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.05);display:grid;place-items:center;transition:.2s}
.bk-card .read-ic svg{width:13px;height:13px;color:var(--gold-soft)}

/* 書卷詳情浮層 */
.modal-mask{position:fixed;inset:0;background:rgba(6,9,18,.72);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:22px;overflow-y:auto}
.modal-mask.on{display:flex}
.modal{width:min(660px,100%);background:var(--card2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:30px;animation:popin .3s ease}
@keyframes popin{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal .m-kicker{font-size:11.5px;letter-spacing:2px;color:var(--gold-dim);font-weight:600;text-transform:uppercase}
.modal h3{font-family:var(--serif);font-size:26px;font-weight:700;margin:6px 0 2px}
.modal .m-en{font-size:13px;color:var(--ink-faint);margin-bottom:14px}
.modal .m-ch{color:var(--gold-soft);font-size:14px;margin-bottom:14px}
.modal .m-theme{background:rgba(201,164,92,.07);border-left:3px solid var(--gold);padding:12px 16px;border-radius:0 10px 10px 0;color:var(--ink-dim);font-size:14.5px;line-height:1.8;margin-bottom:16px}
.modal .m-key{font-family:var(--serif);font-size:17px;line-height:1.9;color:var(--ink);padding:6px 4px 14px}
.modal .m-key small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-faint);margin-top:8px}
.modal .m-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ================= 章節閱讀器 ================= */
.reader-wrap{max-width:760px;margin:0 auto}
.reader-tools{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;
  background:var(--card);border:1px solid var(--line2);border-radius:12px;margin-bottom:18px;
}
.reader-tools .rt-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:rgba(255,255,255,.03);color:var(--ink-dim);font-size:13px}
.reader-tools .rt-item svg{width:15px;height:15px;color:var(--gold-dim)}
.reader-tools .rt-item:hover{color:var(--gold-soft)}
.reader-tools .spacer{flex:1}
.chap-head{text-align:center;padding:26px 20px 22px;position:relative}
.chap-head::after{content:"";display:block;width:52px;height:2px;background:var(--grad);margin:16px auto 0;border-radius:2px}
.chap-head .ch-k{font-family:var(--serif);font-size:11px;letter-spacing:4px;color:var(--gold-dim);font-weight:600}
.chap-head h2{font-family:var(--serif);font-size:clamp(22px,3vw,30px);font-weight:700;margin:8px 0 4px}
.chap-head .ch-book{font-size:14px;color:var(--ink-dim)}
.chap-head .ch-sub{font-size:12.5px;color:var(--ink-faint);margin-top:4px;font-style:italic}
.verses{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:30px 34px;box-shadow:var(--shadow-sm);column-width:340px;column-gap:40px;column-rule:1px solid var(--line2)}
.vs{break-inside:avoid;margin-bottom:11px;line-height:1.95;font-family:var(--serif);font-size:17px;color:var(--ink)}
.vs .vn{
  display:inline-block;min-width:22px;color:var(--gold);font-family:var(--sans);
  font-size:11px;font-weight:700;vertical-align:super;margin-right:6px;
}
.vs .vt{color:#cdd5e6}
.reader-nav{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
.reader-nav .rn-grp{display:flex;gap:10px;align-items:center}
.reader-nav .chap-idx{font-family:var(--serif);color:var(--ink-dim);font-size:14px}
.chap-list{display:flex;flex-wrap:wrap;gap:7px;padding:16px 18px;background:var(--card);border:1px solid var(--line2);border-radius:12px;margin-bottom:20px}
.chap-list .cl-title{width:100%;font-size:11px;letter-spacing:2px;color:var(--ink-faint);font-weight:600;padding-bottom:6px}
.chap-list a{min-width:36px;text-align:center;padding:6px 4px;border-radius:7px;background:rgba(255,255,255,.03);font-size:13px;color:var(--ink-dim);transition:.12s}
.chap-list a:hover{background:var(--gold);color:#0e1220;font-weight:700}
.chap-list a.on{background:rgba(201,164,92,.2);color:var(--gold-soft);font-weight:700}

/* ================= 搜尋 ================= */
.search-box{display:flex;gap:10px;margin-bottom:22px}
.search-box input{
  flex:1;padding:14px 18px;border-radius:12px;border:1px solid var(--line2);
  background:var(--card);color:var(--ink);font-size:15px;font-family:inherit;outline:none;transition:.15s;
}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,164,92,.15)}
.search-box input::placeholder{color:var(--ink-faint)}
.search-summary{font-size:13.5px;color:var(--ink-dim);margin-bottom:14px;padding:10px 14px;background:rgba(201,164,92,.06);border-left:3px solid var(--gold);border-radius:0 8px 8px 0}
.search-results{display:flex;flex-direction:column;gap:10px}
.sr-item{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;background:var(--card);border:1px solid var(--line2);border-radius:11px;cursor:pointer;transition:.15s}
.sr-item:hover{border-color:var(--line);transform:translateX(3px)}
.sr-item .sr-type{flex:none;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:1px}
.sr-type.t-gold{background:rgba(201,164,92,.15);color:var(--gold-soft)}
.sr-type.t-navy{background:rgba(90,120,220,.16);color:#a9bdf0}
.sr-type.t-crimson{background:rgba(220,100,100,.15);color:#f0a9a9}
.sr-item .sr-ref{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--gold-soft)}
.sr-item .sr-text{font-size:14px;color:var(--ink-dim);line-height:1.7;margin-top:3px}
.sr-item .sr-text b{color:var(--gold-soft);font-weight:600}

/* ================= 每日金句 ================= */
.golden-wrap{max-width:720px;margin:0 auto;text-align:center}
.golden-card{
  background:linear-gradient(160deg,#1a2340,#141a2e);border:1px solid var(--line);border-radius:18px;
  padding:50px 44px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:24px;
}
.golden-card::before{content:"❝";position:absolute;top:-14px;left:20px;font-family:var(--serif);font-size:130px;color:rgba(201,164,92,.12);line-height:1}
.golden-card .g-text{font-family:var(--serif);font-size:clamp(20px,2.8vw,28px);line-height:1.9;color:var(--ink);position:relative;min-height:120px;display:flex;align-items:center;justify-content:center}
.golden-card .g-ref{margin-top:26px;color:var(--gold-soft);font-size:14.5px;letter-spacing:1px;position:relative}
.golden-card .g-acts{display:flex;gap:10px;justify-content:center;margin-top:28px;position:relative;flex-wrap:wrap}
.golden-opt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ================= 統計 ================= */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-tile{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:20px;text-align:center}
.stat-tile b{font-family:var(--serif);font-size:30px;font-weight:900;color:var(--gold-soft)}
.stat-tile span{display:block;font-size:12.5px;color:var(--ink-faint);margin-top:4px;letter-spacing:1px}
.chart-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.chart-box{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:16px}
.chart-box h4{font-family:var(--serif);font-size:16px;color:var(--ink);margin-bottom:6px}
.chart-box .c-sub{font-size:12px;color:var(--ink-faint);margin-bottom:10px}
.chart-holder{width:100%;height:280px}

/* ================= 複習功能 ================= */
.rev-hero{text-align:center;padding:34px 20px;background:linear-gradient(150deg,#1a2340,#101526);border:1px solid var(--line);border-radius:16px;margin-bottom:26px}
.rev-hero h2{font-family:var(--serif);font-size:26px;font-weight:700}
.rev-hero p{color:var(--ink-dim);margin-top:8px;font-size:14.5px}
.rev-hero .rev-progress{max-width:480px;margin:20px auto 0;text-align:left}
.rev-hero .rev-progress .rp-bar{height:10px;background:rgba(255,255,255,.07);border-radius:10px;overflow:hidden;margin-top:8px}
.rev-hero .rev-progress .rp-fill{height:100%;background:var(--grad);border-radius:10px;transition:width .6s ease}
.rev-hero .rev-progress .rp-label{font-size:12.5px;color:var(--ink-faint);display:flex;justify-content:space-between;margin-top:6px}

.flash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}

.flash-inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.flash-card.flip .flash-inner{transform:rotateY(180deg)}
.flash-face{
  position:absolute;inset:0;backface-visibility:hidden;border-radius:13px;padding:18px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  border:1px solid var(--line2);box-shadow:var(--shadow-sm);
}
.flash-front{background:var(--card);gap:8px}
.flash-front .ff-ref{font-family:var(--serif);font-size:17px;color:var(--gold-soft);font-weight:600}
.flash-front .ff-tip{font-size:11px;color:var(--ink-faint)}
.flash-back{background:linear-gradient(160deg,#222c50,#1a2340);border-color:var(--line);transform:rotateY(180deg)}
.flash-back .fb-text{font-family:var(--serif);font-size:15px;line-height:1.8;color:var(--ink)}
.flash-back .fb-ref{font-size:11.5px;color:var(--gold-dim);margin-top:10px}

/* 填空測驗 */
.quiz-card{background:var(--card);border:1px solid var(--line2);border-radius:15px;padding:30px;max-width:640px;margin:0 auto;box-shadow:var(--shadow-sm)}
.quiz-progress{display:flex;gap:6px;margin-bottom:20px}
.quiz-progress i{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.08)}
.quiz-progress i.done{background:var(--gold)}
.quiz-progress i.cur{background:var(--gold-soft)}
.quiz-q{font-family:var(--serif);font-size:20px;line-height:2;color:var(--ink);min-height:100px;margin-bottom:22px;padding:14px;background:rgba(255,255,255,.02);border-radius:11px}
.quiz-q .blank{display:inline-block;min-width:70px;border-bottom:2px dashed var(--gold);color:transparent;margin:0 3px;padding:0 4px}
.quiz-q .blank.filled{color:var(--gold-soft);border-bottom-style:solid}
.quiz-options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
.quiz-options button{padding:13px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line2);color:var(--ink);font-size:15px;font-family:var(--serif);transition:.15s}
.quiz-options button:hover{border-color:var(--gold);color:var(--gold-soft)}
.quiz-options button.correct{background:rgba(120,200,150,.18);border-color:#7cc89a;color:#9fe0b8}

.quiz-feedback.show{display:block}

.quiz-feedback.no{background:rgba(220,100,100,.12);color:#f0a9a9;border:1px solid rgba(220,100,100,.3)}
.quiz-acts{display:flex;justify-content:space-between;align-items:center}
.quiz-score{font-size:13.5px;color:var(--ink-dim)}
.quiz-score b{color:var(--gold-soft)}

.prog-list{display:flex;flex-direction:column;gap:8px}

.prog-item .pi-name{font-family:var(--serif);font-size:15px;font-weight:600;width:120px;flex:none;color:var(--ink)}
.prog-item .pi-bar{flex:1;height:8px;background:rgba(255,255,255,.07);border-radius:8px;overflow:hidden}
.prog-item .pi-fill{height:100%;background:var(--grad);border-radius:8px;transition:width .5s}
.prog-item .pi-num{font-size:12.5px;color:var(--ink-faint);width:92px;text-align:right;flex:none}

/* ================= 書籤 ================= */
.bm-list{display:flex;flex-direction:column;gap:10px}
.bm-item{display:flex;align-items:center;gap:16px;padding:15px 18px;background:var(--card);border:1px solid var(--line2);border-radius:11px;cursor:pointer;transition:.15s}
.bm-item:hover{border-color:var(--line);transform:translateX(3px)}
.bm-item .bm-ic{width:38px;height:38px;flex:none;border-radius:10px;background:rgba(201,164,92,.12);display:grid;place-items:center}
.bm-item .bm-ic svg{width:17px;height:17px;color:var(--gold-soft)}
.bm-item .bm-ref{font-family:var(--serif);font-weight:600;color:var(--gold-soft);font-size:15px}
.bm-item .bm-text{font-size:13.5px;color:var(--ink-dim);line-height:1.6}
.bm-item .bm-del{margin-left:auto;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-faint);flex:none;transition:.15s}
.bm-item .bm-del:hover{color:#f0a9a9;background:rgba(220,100,100,.12)}
.empty{text-align:center;color:var(--ink-faint);padding:44px 20px;font-size:15px}
.empty b{display:block;font-family:var(--serif);font-size:18px;color:var(--ink-dim);margin-bottom:6px}

/* ================= 頁尾 ================= */
.site-footer{margin-top:52px;padding-top:30px;border-top:1px solid var(--line2)}
.site-footer .sf-meta{display:flex;flex-direction:column;gap:5px;align-items:center;text-align:center;font-size:12.5px;color:var(--ink-faint);line-height:1.7;padding-bottom:8px}
.site-footer .sf-meta .sf-brand{font-family:var(--serif);font-size:14px;color:var(--gold-dim);letter-spacing:1px;font-weight:600}

/* toast */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--card2);border:1px solid var(--line);color:var(--ink);padding:12px 22px;
  border-radius:11px;box-shadow:var(--shadow);font-size:14px;opacity:0;visibility:hidden;
  transition:.3s;z-index:200;display:flex;gap:9px;align-items:center;
}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.toast svg{width:16px;height:16px;color:var(--gold-soft)}

/* ===== 書籤與進度（localStorage）===== */
let bookmarks=JSON.parse(localStorage.getItem("bible_bm")||"[]");
let readProgress=JSON.parse(localStorage.getItem("bible_prog")||"{}");
let quizBest=JSON.parse(localStorage.getItem("bible_quiz")||"{}");
function saveBookmarks(){localStorage.setItem("bible_bm",JSON.stringify(bookmarks));}
function saveProgress(){localStorage.setItem("bible_prog",JSON.stringify(readProgress));}
function markRead(name,ch){const k=name2code[name]||name;if(!readProgress[k])readProgress[k]=[];if(!readProgress[k].includes(ch)){readProgress[k].push(ch);saveProgress();}}
function isRead(name,ch){const k=name2code[name]||name;return !!(readProgress[k]&&readProgress[k].includes(ch));}
function addBookmark(ref,text){if(bookmarks.some(b=>b.ref===ref)){toast("已在書籤中");return;}bookmarks.unshift({ref,text});saveBookmarks();toast("已加入書籤");}
function delBookmark(ref){bookmarks=bookmarks.filter(b=>b.ref!==ref);saveBookmarks();renderBookmarks();}

/* ===== 快速跳轉下拉選單 ===== */
let curBook=null,curChap=null;
function initQuickJump(){
  const bm=$("#qjBookMenu");
  bm.innerHTML=GRPS.map(g=>`<div class="qj-group">${g}</div>`+ALL_BOOKS.filter(b=>b.grp===g).map(b=>`
    <div class="qj-item" data-book="${b.name}"><span>${b.name}</span><span class="qj-ch">${b.ch}章</span></div>`).join("")).join("");
  bm.addEventListener("click",e=>{
    const it=e.target.closest(".qj-item");if(!it)return;
    curBook=it.dataset.book;$("#qjBookLabel").textContent=curBook;
    $("#qjBookWrap").classList.remove("open");
    buildChapterMenu(curBook);
    $("#qjChapWrap").classList.add("open");
  });
  $("#qjBookBtn").addEventListener("click",()=>{
    $("#qjBookWrap").classList.toggle("open");$("#qjChapWrap").classList.remove("open");
  });
  $("#qjChapBtn").addEventListener("click",()=>{
    if(!curBook){toast("請先選擇書卷");return;}
    $("#qjChapWrap").classList.toggle("open");$("#qjBookWrap").classList.remove("open");
  });
  document.addEventListener("click",e=>{
    if(!e.target.closest(".quickjump")){$("#qjBookWrap").classList.remove("open");$("#qjChapWrap").classList.remove("open");}
  });
}
function buildChapterMenu(name){
  const n=bookChapterCount(name)||bookByName(name).ch;
  const cm=$("#qjChapMenu");
  cm.innerHTML=`<div class="qj-group">${name} · ${n}章</div><div class="qj-chapters">${Array.from({length:n},(_,i)=>`<div class="c" data-ch="${i+1}">${i+1}</div>`).join("")}</div>`;
  cm.querySelectorAll(".c").forEach(el=>el.addEventListener("click",()=>{
    curChap=+el.dataset.ch;$("#qjChapLabel").textContent=`第${curChap}章`;
    $("#qjChapWrap").classList.remove("open");
    goReader(name,curChap);
  }));
}

/* ===== 路由 ===== */
const routes={home:renderHome,books:renderBooks,reader:renderReader,search:renderSearch,golden:renderGolden,stats:renderStats,review:renderReview,bookmarks:renderBookmarks};
function parseHash(){
  const h=location.hash.replace("#","");
  if(h.startsWith("reader/")){
    const parts=h.split("/");
    return {view:"reader",book:decodeURIComponent(parts[1]||""),chap:+(parts[2]||1)};
  }
  return {view:h||"home"};
}
function router(){
  const r=parseHash();
  if(r.view==="reader"){
    switchView("reader");renderReader(r.book||"創世記",r.chap||1);return;
  }
  if(routes[r.view]){switchView(r.view);routes[r.view]();}
  else{switchView("home");renderHome();}
}
function go(view){location.hash=view;}
function goReader(name,chap){
  curBook=name;curChap=chap;
  $("#qjBookLabel").textContent=name;$("#qjChapLabel").textContent=`第${chap}章`;
  location.hash=`reader/${encodeURIComponent(name)}/${chap}`;
  switchView("reader");renderReader(name,chap);
}

let fontScale=1;
function changeFont(d){
  fontScale=Math.max(.85,Math.min(1.5,fontScale+d*.12));

  toast(fontScale>=1.5?"已到最大字級":fontScale<=.85?"已到最小字級":"字級："+Math.round(fontScale*100)+"%");
}
function copyChapter(){
  const name=curBook,chap=curChap;

  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(`${name} 第${chap}章\n\n${text}`).then(()=>toast("本章已複製"));}
  else toast("複製失敗，請手動選取");
}
function bookmarkChapter(){
  const name=curBook,chap=curChap;

function renderSearch(){
  const el=$("#view-search");
  el.innerHTML=`
  <div class="sect-head"><h2>全文搜尋<small>檢索全部 66 卷、31,021 節經文</small></h2></div>
  <div class="search-box">
    <input id="searchInput" placeholder="輸入關鍵字，例如：愛、憐憫、信心、永生…" onkeydown="if(event.key==='Enter')doSearch()">
    <button class="btn btn-gold" onclick="doSearch()">搜尋</button>
  </div>
  <div id="searchOut"></div>`;
  $("#searchInput").focus();
}
function doSearch(){
  const q=$("#searchInput").value.trim();
  const out=$("#searchOut");
  if(!q){out.innerHTML=`<div class="empty"><b>輸入關鍵字</b>開始搜尋全庫經文</div>`;return;}
  const ql=q.toLowerCase();
  const found=[];
  let count=0;
  for(const code in window.BIBLE_TEXT){
    const bk=window.BIBLE_TEXT[code];
    (bk.chapters||[]).forEach((ch,ci)=>{
      if(!ch)return;
      ch.forEach(v=>{
        if(v.t&&v.t.toLowerCase().includes(ql)){
          count++;
          if(count<=100){
            const idx=v.t.toLowerCase().indexOf(ql);
            found.push({name:bk.name,ref:`${ci+1}:${v.v}`,t:v.t,hl:idx});
          }
        }
      });
    });
  }
  if(!count){out.innerHTML=`<div class="empty"><b>沒有找到</b>與「${esc(q)}」相關的經文</div>`;return;}
  const head=`<div class="search-summary">找到 <strong style="color:var(--gold-soft)">${count}</strong> 節經文${count>100?`（顯示前 100 節）`:""}</div>`;
  out.innerHTML=head+`<div class="search-results">`+found.map(r=>{
    const a=r.hl;const s=Math.max(0,a-24);const e=Math.min(r.t.length,a+q.length+30);
    const prefix=s>0?"…":"",suffix=e<r.t.length?"…":"";
    const frag=r.t.slice(s,e).replace(new RegExp(esc(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")),"gi"),m=>`<b>${esc(m)}</b>`);
    return `<div class="sr-item" onclick="goReader('${r.name}',${+r.ref.split(":")[0]})">
      <div class="sr-type t-gold">經文</div>
      <div><div class="sr-ref">${r.name} ${r.ref}</div><div class="sr-text">${prefix}${frag}${suffix}</div></div>
    </div>`;
  }).join("")+`</div>`;
}

  const rows=ALL_BOOKS.map(b=>{
    const k=name2code[b.name];const read=(readProgress[k]||[]).length;
    return `<div class="prog-item"><div class="pi-name">${b.name}</div>
      <div class="pi-bar"><div class="pi-fill" style="width:${Math.round(read/b.ch*100)}%"></div></div>
      <div class="pi-num">${read} / ${b.ch} 章</div></div>`;
  }).join("");
  p.innerHTML=`<div class="prog-list">${rows}</div>`;
}
let flashPairs=[];
function drawFlash(){
  const p=$("#revPanels [data-p=flash]");
  flashPairs=GOLDENS.map(g=>({ref:`${g[0]} ${g[1]}`,text:g[2]}));
  p.innerHTML=`<div class="sect-head"><h2>記憶背誦<small>點擊卡片翻面查看經文</small></h2></div>
    <div class="flash-grid" id="flashGrid">${flashPairs.map((f,i)=>flashCard(f,i)).join("")}</div>`;
  $("#flashGrid").addEventListener("click",e=>{
    const c=e.target.closest(".flash-card");if(c)c.classList.toggle("flip");
  });
}
function flashCard(f,i){
  return `<div class="flash-card"><div class="flash-inner">
    <div class="flash-face flash-front"><div class="ff-ref">${esc(f.ref)}</div><div class="ff-tip">點擊翻面</div></div>
    <div class="flash-face flash-back"><div class="fb-text">${esc(f.text)}</div><div class="fb-ref">${esc(f.ref)}</div></div>
  </div></div>`;
}
let quizState=null;
function startQuiz(){
  const p=$("#revPanels [data-p=quiz]");
  const quizPool=GOLDENS.map(g=>({ref:`${g[0]} ${g[1]}`,text:g[2]}));
  // 洗牌取 5 題
  const pool=[...quizPool].sort(()=>Math.random()-.5).slice(0,5);
  quizState={pool,idx:0,score:0,answered:false};
  p.innerHTML=`<div class="quiz-card" id="quizCard"></div>`;
  drawQuiz();
}
function drawQuiz(){
  const q=quizState.pool[quizState.idx];
  const c=$("#quizCard");if(!c)return;
  const words=Array.from(q.text);
  const candidates=words.filter(w=>w.trim()&&!"，。；：！？「」『』的我是你了他它在和有與不又為".includes(w));
  const target=candidates[Math.floor(Math.random()*candidates.length)];
  const opts=unique([target,...pick3(q.text,target)]);
  c.innerHTML=`
  <div class="quiz-progress">${quizState.pool.map((_,i)=>`<i class="${i<quizState.idx?'done':i===quizState.idx?'cur':''}"></i>`).join("")}</div>
  <div class="quiz-q">${renderBlank(q.text,target)}</div>
  <div class="quiz-options">${opts.map(o=>`<button data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div>
  <div class="quiz-feedback" id="qfb"></div>
  <div class="quiz-acts">
    <div class="quiz-score">得分 <b>${quizState.score}</b> / ${quizState.pool.length}</div>
    <button class="btn btn-line" id="qNext" style="display:none">下一題 →</button>
  </div>`;
  const blankChar=target;
  $$("#quizCard .quiz-options button").forEach(b=>b.addEventListener("click",()=>{
    if(quizState.answered)return;quizState.answered=true;
    const ok=b.dataset.opt===blankChar;
    b.classList.add(ok?"correct":"wrong");
    const fb=$("#qfb");fb.classList.add("show",ok?"ok":"no");
    fb.textContent=ok?"答對了！":"答錯了，正確是「"+blankChar+"」";
    if(ok)quizState.score++;
    $$("#quizCard .quiz-options button").forEach(x=>{if(x.dataset.opt===blankChar&&!ok)x.classList.add("correct");});
    const nxt=$("#qNext");nxt.style.display="inline-flex";
    nxt.onclick=()=>{quizState.idx++;quizState.answered=false;if(quizState.idx>=quizState.pool.length){finishQuiz();}else drawQuiz();};
  }));
  quizState._target=target;
}
function renderBlank(text,t){
  const a=text.indexOf(t);
  return esc(text.slice(0,a))+'<span class="blank">'+esc(t)+'</span>'+esc(text.slice(a+t.length));
}
function unique(a){return a.filter((v,i)=>a.indexOf(v)===i);}
function pick3(text,t){
  const all=Array.from(new Set(Array.from(text).filter(w=>w.trim()&&!"，。；：！？「」『』的我是你了他它在和有與不又為".includes(w)))).filter(w=>w!==t);
  const pool=all.length>=3?all:[...all,"愛","信","望","恩","義","光","道","心","靈"];
  return [...new Set(pool)].sort(()=>Math.random()-.5).slice(0,3);
}
function finishQuiz(){
  const c=$("#quizCard");
  const pct=Math.round(quizState.score/quizState.pool.length*100);
  const prev=quizBest.best||0;
  if(quizState.score>prev){quizBest.best=quizState.score;localStorage.setItem("bible_quiz",JSON.stringify(quizBest));}
  c.innerHTML=`
    <div style="text-align:center;padding:20px 0">
      <div class="stat-tile" style="margin:0 auto 16px"><b>${quizState.score}</b><span>/ ${quizState.pool.length} 題正確</span></div>
      <h3 style="font-family:var(--serif);font-size:22px;margin-bottom:14px">${pct>=80?"太棒了！":pct>=50?"不錯！再接再厲":"繼續努力！"}</h3>
      <p style="color:var(--ink-dim);margin-bottom:20px">你的最佳紀錄：${Math.max(prev,quizState.score)} / ${quizState.pool.length} 題</p>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn btn-gold" onclick="startQuiz()">再測一次</button>
        <button class="btn btn-ghost" onclick="switchTab('flash')">去背誦</button>
      </div>
    </div>`;
}
function switchTab(t){revTab=t;renderReview();}

/* ===== 書籤 ===== */
function renderBookmarks(){
  const el=$("#view-bookmarks");
  el.innerHTML=`<div class="sect-head"><h2>我的書籤<small>收藏的經文與金句</small></h2></div>`;
  if(!bookmarks.length){
    el.innerHTML+=`<div class="empty"><b>尚無書籤</b>在閱讀或金句頁點「收藏」即可在此保留</div>`;
    return;
  }
  el.innerHTML+=`<div class="bm-list">${bookmarks.map((b,i)=>`
    <div class="bm-item" onclick="gotoBookmark(${i})">
      <div class="bm-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18l-6-4-6 4z"/></svg></div>
      <div><div class="bm-ref">${esc(b.ref)}</div><div class="bm-text">${esc(b.text)}</div></div>
      <button class="bm-del" onclick="event.stopPropagation();delBookmark('${esc(b.ref)}')">✕</button>
    </div>`).join("")}</div>`;
}
function gotoBookmark(i){
  const b=bookmarks[i];
  const parts=b.ref.split(" ");
  const name=parts[0],ch=+(parts[1].split(":")[0]);
  goReader(name,ch);
}

/* ===== 初始化 ===== */
function init(){
  initQuickJump();
  window.addEventListener("hashchange",router);
  router();
  $("#menuBtn").addEventListener("click",()=>$("#sidebar").classList.toggle("open"));
  $("#sidebar").addEventListener("click",e=>{if(window.innerWidth<=860&&e.target.closest("a"))$("#sidebar").classList.remove("open");});
  if(!window.BIBLE_TEXT)toast("經文資料載入失敗，請確認 assets/bible_text.js 存在");
}
init();
</script>
