<meta name="description" content="收錄舊約新約66卷聖經書庫、精選經文、章節閱讀、全文搜尋、讀經計畫與主題文章——聖經Bible聖經知識與相關功能網站。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231f2a44'/%3E%3Cpath d='M12 5c-2-1.5-4.5-2-7-2v16c2.5 0 5 .5 7 2 2-1.5 4.5-2 7-2V3c-2.5 0-5 .5-7 2z' fill='none' stroke='%23c9a45c' stroke-width='1.4'/%3E%3Cpath d='M12 5v16' fill='none' stroke='%23c9a45c' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<style>
  :root{
    --ink:#1d2733;
    --ink-soft:#5b6b7c;
    --parch:#f7f1e3;
    --parch-2:#efe4cd;
    --navy:#1f2a44;
    --navy-2:#2e3d63;
    --gold:#b58a3c;
    --gold-2:#c9a45c;
    --crimson:#8c2f39;
    --line:#d8c9a8;
    --card:#fffdf6;
    --shadow:0 10px 30px rgba(31,42,68,.10);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:auto}
  body{
    font-family:"Noto Sans TC","Noto Sans SC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--ink);
    background:var(--parch);
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.serif{font-family:"Noto Serif TC","Noto Serif SC","Songti TC",serif}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}
  /* ===== 頂欄 ===== */
  header.top{
    position:sticky;top:0;z-index:50;
    background:rgba(247,241,227,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;gap:22px;padding:14px 0;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.15rem;color:var(--navy)}
  .brand .emblem{width:38px;height:38px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;color:var(--gold-2)}
  .nav-links{display:flex;gap:4px;flex-wrap:wrap}
  .nav-links a{
    padding:8px 14px;border-radius:9px;font-size:.95rem;color:var(--ink-soft);
    transition:background .2s,color .2s;
  }
  .nav-links a:hover{background:var(--parch-2);color:var(--navy)}
  .nav-links a.active{background:var(--navy);color:#f7f1e3}
  .nav-search{margin-left:auto;display:flex;gap:8px;align-items:center}
  .nav-search input{
    padding:8px 14px;border:1px solid var(--line);border-radius:20px;
    background:var(--card);font-size:.92rem;width:220px;color:var(--ink);outline:none;
    font-family:inherit;
  }
  .nav-search input:focus{border-color:var(--gold)}
  /* ===== 視圖容器 ===== */
  main{min-height:72vh;padding:34px 0 60px}
  .view{display:none;animation:fade .35s ease}
  .view.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  /* ===== 首頁 hero ===== */
  .hero{
    position:relative;overflow:hidden;border-radius:20px;
    background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);
    color:#f7f1e3;padding:64px 56px;margin-bottom:36px;
    box-shadow:var(--shadow);
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background-image:url("assets/hero-bible.jpg");
    background-size:cover;background-position:center 42%;
    opacity:.9;
  }
  .hero::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,rgba(23,31,49,.92) 0%,rgba(23,31,49,.72) 45%,rgba(23,31,49,.35) 100%);
  }
  .hero .hero-inner{position:relative;z-index:2}
  .hero .orn{position:absolute;right:-30px;top:-40px;opacity:.14;width:360px;height:360px}
  .hero .kicker{letter-spacing:.32em;font-size:.8rem;color:var(--gold-2);margin-bottom:14px;font-weight:500}
  .hero h1{font-size:clamp(1.9rem,4vw,3.2rem);line-height:1.25;font-weight:900;margin-bottom:16px;text-wrap:balance}
  .hero p.sub{font-size:clamp(1rem,1.6vw,1.22rem);max-width:640px;color:#d8cdb8;margin-bottom:28px;font-weight:300}
  .hero .stats{display:flex;flex-wrap:wrap;gap:30px;margin-bottom:8px}
  .hero .stat .num{font-size:1.9rem;font-weight:900;color:var(--gold-2);font-family:"Noto Serif TC",serif}
  .hero .stat .lbl{font-size:.86rem;color:#bfb196}
  .hero-actions{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
  .btn{
    display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:11px;
    font-weight:600;font-size:.98rem;cursor:pointer;border:1px solid transparent;
    transition:transform .15s,box-shadow .2s,background .2s;font-family:inherit;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn-gold{background:var(--gold);color:#fffdf6;box-shadow:0 6px 18px rgba(181,138,60,.4)}
  .btn-gold:hover{background:var(--gold-2)}
  .btn-ghost{background:transparent;color:#f7f1e3;border-color:rgba(247,241,227,.5)}
  .btn-ghost:hover{background:rgba(247,241,227,.12)}
  .btn-navy{background:var(--navy);color:#f7f1e3}
  .btn-navy:hover{background:var(--navy-2)}
  .btn-line{background:var(--card);color:var(--navy);border-color:var(--line)}
  .btn-line:hover{border-color:var(--gold);color:var(--navy)}
  /* ===== 通用區塊 ===== */
  .sec-title{font-size:1.6rem;font-weight:800;color:var(--navy);margin-bottom:6px}
  .sec-sub{color:var(--ink-soft);margin-bottom:24px}
  .grid{display:grid;gap:20px}
  .g4{grid-template-columns:repeat(4,1fr)}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:repeat(2,1fr)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 4px 14px rgba(31,42,68,.05);cursor:pointer;transition:transform .18s,box-shadow .2s,border-color .2s}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--gold-2)}
  .card h3{font-size:1.15rem;color:var(--navy);margin-bottom:6px}
  .card p{font-size:.92rem;color:var(--ink-soft)}
  .tag{display:inline-block;padding:3px 11px;border-radius:20px;font-size:.75rem;font-weight:500;background:var(--parch-2);color:var(--navy);margin-right:6px;margin-bottom:8px}
  .tag.gold{background:rgba(181,138,60,.18);color:#8a6520}
  .tag.navy{background:rgba(31,42,68,.12);color:var(--navy)}
  .tag.crimson{background:rgba(140,47,57,.12);color:var(--crimson)}
  .section{margin-bottom:40px}
  /* ===== 書卷導覽 ===== */
  .book-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .book-filter button{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:.9rem;font-family:inherit;color:var(--ink-soft);transition:all .15s}
  .book-filter button.active{background:var(--navy);color:#f7f1e3;border-color:var(--navy)}
  .book-group-title{font-size:1.25rem;font-weight:800;color:var(--crimson);margin:26px 0 14px;display:flex;align-items:center;gap:10px}
  .book-group-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .book-card .bnum{font-size:.78rem;color:var(--gold);font-weight:700;letter-spacing:.08em}
  .book-card h3{font-size:1.2rem}
  .book-card .meta{font-size:.8rem;color:var(--ink-soft);margin-top:6px}
  /* ===== 閱讀器 ===== */
  .reader-picker{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
  .picker{display:flex;flex-direction:column;gap:6px}
  .picker label{font-size:.82rem;color:var(--ink-soft);font-weight:600}
  select{
    padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    font-size:.95rem;color:var(--ink);font-family:inherit;outline:none;min-width:220px;
  }
  select:focus{border-color:var(--gold)}
  .reader{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:40px 48px;box-shadow:var(--shadow);max-width:820px;margin:0 auto;
  }
  .reader .rhead{text-align:center;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}
  .reader .rhead .ref{font-size:1.6rem;font-weight:900;color:var(--navy)}
  .reader .rhead .tname{font-size:.9rem;color:var(--gold);letter-spacing:.1em;font-weight:600}
  .verse{display:flex;gap:14px;margin-bottom:18px}
  .rchaphead{text-align:center;font-size:1.15rem;font-weight:700;color:var(--navy);font-family:"Noto Serif TC","Songti TC",serif;margin:0 auto 26px;padding:10px 18px;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);max-width:620px}
  .verse .vnum{font-size:.82rem;font-weight:700;color:var(--gold);min-width:26px;text-align:right;padding-top:6px}
  .verse .vtext{font-size:1.06rem;font-family:"Noto Serif TC","Songti TC",serif;color:#2c3a4d;flex:1}
  .reader-nav{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
  .reader-nav .btn{padding:10px 18px;font-size:.92rem}
  .bookmark-btn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer;color:var(--navy);font-size:.9rem;font-family:inherit}
  .bookmark-btn.on{background:var(--navy);color:#f7f1e3;border-color:var(--navy)}
  /* ===== 經文 ===== */
  .verse-block{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:18px 22px;margin-bottom:16px}
  .verse-block .ref{font-weight:700;color:var(--navy);font-size:.9rem;margin-bottom:6px}
  .verse-block .txt{font-family:"Noto Serif TC",serif;font-size:1rem;color:#2c3a4d;font-style:italic}
  /* ===== 搜尋 ===== */
  .search-box{display:flex;gap:10px;max-width:640px;margin-bottom:28px}
  .search-box input{flex:1;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:1rem;font-family:inherit;color:var(--ink);outline:none}
  .search-box input:focus{border-color:var(--gold)}
  .search-box button{padding:0 24px;border-radius:12px;border:none;background:var(--gold);color:#fffdf6;font-weight:600;cursor:pointer;font-size:1rem}
  .result-item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:12px;cursor:pointer;transition:border-color .15s}
  .result-item:hover{border-color:var(--gold-2)}
  .result-item .rtype{font-size:.74rem;font-weight:700;letter-spacing:.08em}
  .result-item .rtitle{font-weight:700;color:var(--navy);margin:4px 0}
  .result-item .rsnip{font-size:.9rem;color:var(--ink-soft)}
  .empty{color:var(--ink-soft);text-align:center;padding:48px 0}
  /* ===== 文章 ===== */
  .article-card h3{font-size:1.15rem}
  .article-card .excerpt{font-size:.92rem;color:var(--ink-soft);margin-top:8px}
  .article-body{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:44px 52px;box-shadow:var(--shadow)}
  .article-body h1{font-size:1.9rem;color:var(--navy);margin-bottom:10px}
  .article-body .ameta{color:var(--ink-soft);font-size:.9rem;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .article-body h2{font-size:1.3rem;color:var(--navy);margin:28px 0 12px}
  .article-body h3{font-size:1.12rem;color:var(--navy-2);margin:22px 0 10px}
  .article-body p{margin-bottom:16px}
  .article-body ul,.article-body ol{margin:0 0 16px 24px}
  .article-body li{margin-bottom:8px}
  .article-body blockquote{border-left:4px solid var(--gold);padding:12px 20px;background:var(--parch);margin:18px 0;color:var(--navy-2);font-family:"Noto Serif TC",serif;font-style:italic;border-radius:8px}
  .article-body .verse-q{color:var(--crimson);font-weight:600}
  /* ===== 統計圖表 ===== */
  .chart-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 4px 14px rgba(31,42,68,.05)}
  .chart-card h3{color:var(--navy);margin-bottom:4px}
  .chart-card p{color:var(--ink-soft);font-size:.88rem;margin-bottom:14px}
  .chart-box{width:100%;height:340px}
  /* ===== 書籤 ===== */
  .bm-list .bm-item{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:12px}
  .bm-item .bmtitle{font-weight:700;color:var(--navy)}
  .bm-item .bmmeta{font-size:.85rem;color:var(--ink-soft)}
  .bm-item button{background:var(--crimson);color:#fff;border:none;border-radius:9px;padding:7px 14px;cursor:pointer;font-family:inherit;font-size:.86rem}
  /* ===== 頁腳 ===== */
  footer{background:var(--navy);color:#bfb196;padding:36px 0;text-align:center;font-size:.9rem}
  footer .f-title{font-size:1.1rem;color:#f7f1e3;font-weight:700;margin-bottom:8px}
  /* ===== 響應式 ===== */
  @media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
  @media(max-width:620px){
    .g4,.g3{grid-template-columns:1fr}
    .nav-search input{width:150px}
    .hero{padding:40px 26px}
    .reader{padding:28px 20px}
    .article-body{padding:30px 24px}
    .nav-links a{padding:11px 14px;font-size:.95rem;min-height:44px;display:inline-flex;align-items:center}
    .nav{flex-direction:column;align-items:flex-start;gap:12px}
    .nav-search{margin-left:0;width:100%}
    .nav-search input{flex:1;width:auto;font-size:16px}
    .nav-search .btn{padding:11px 16px;font-size:.95rem;min-height:44px}
    .chart-box{height:300px}
    body{font-size:16px}
    .card p,.verse-block .txt,.book-card .meta,.excerpt,.result-item .rsnip{font-size:.95rem}
    .book-filter button,.book-filter button.active{font-size:.92rem;padding:10px 15px;min-height:44px}
    .picker select{font-size:16px}
    .bm-item .bmmeta{font-size:.9rem}
    footer p{font-size:.9rem}
    .kicker{font-size:.85rem;letter-spacing:.2em}
    .hero .stat .lbl{font-size:.95rem}
    .sec-sub{font-size:1rem}
  }
</style>

<!-- ===== 渲染與邏輯 ===== -->
<script>
(function(){
  "use strict";
  const app = document.getElementById("app");
  const mount = document.getElementById("viewMount");
  const NAV = [
    {id:"home",    label:"首頁",   icon:"M3 12l9-9 9 9"},
    {id:"books",   label:"書卷導覽", icon:"M4 19.5A2.5 2.5 0 016.5 17H20"},
    {id:"reader",  label:"章節閱讀", icon:"M12 5c-2-1.5-4.5-2-7-2v16c2.5 0 5 .5 7 2 2-1.5 4.5-2 7-2V3c-2.5 0-5 .5-7 2z"},
    {id:"search",  label:"經文搜尋", icon:"M11 19a8 8 0 100-16 8 8 0 000 16z M21 21l-4.35-4.35"},
    {id:"articles",label:"功能文章", icon:"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z M14 2v6h6"},
    {id:"golden",  label:"每日金句", icon:"M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"},
    {id:"stats",   label:"統計圖表", icon:"M18 20V10M12 20V4M6 20v-6"},
    {id:"bookmarks",label:"我的書籤", icon:"M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"}
  ];

  /* ---------- 狀態 ---------- */
  let state = {
    route:"home",
    bookFilter:"全部",
    readerBook:"詩篇",
    readerChap:23,
    searchQ:"",
    bookmarks:JSON.parse(localStorage.getItem("bibleBookmarks")||"[]")
  };

  /* ---------- 工具 ---------- */
  const $ = (id)=>document.getElementById(id);
  function bookByName(name){return ALL_BOOKS.find(b=>b.name===name);}
  /* 書卷中文名 → BIBLE_TEXT 資料碼 對應 */
  const BOOK_CODE = (()=>{const m={};if(window.BIBLE_TEXT){for(const c in window.BIBLE_TEXT){m[window.BIBLE_TEXT[c].name]=c;}}return m;})();
  function textFor(bookName,chap){ /* 回傳該章逐節陣列，失敗回 null */
    if(!window.BIBLE_TEXT) return null;
    const code=BOOK_CODE[bookName]; if(!code) return null;
    const bk=window.BIBLE_TEXT[code]; if(!bk) return null;
    const ch=bk.chapters[chap-1]; if(!ch||!ch.length) return null;
    return {code, chapters:bk.chapters.length, verses:ch, head:bk.heads&&bk.heads[chap-1]||""};
  }
  function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function getBookmarks(){return state.bookmarks;}
  function saveBookmarks(){localStorage.setItem("bibleBookmarks",JSON.stringify(state.bookmarks));}
  function bmKey(book,chap){return book+"|"+chap;}

  /* ---------- 頂欄導覽 ---------- */
  function renderNav(){
    const nav = $("navLinks");
    nav.innerHTML = NAV.map(n=>{
      return `<a href="#${n.id}" data-route="${n.id}" class="${state.route===n.id?"active":""}">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" style="vertical-align:-2px;margin-right:4px"><path d="${n.icon}"/></svg>${n.label}</a>`;
    }).join("");
    nav.querySelectorAll("a").forEach(a=>{
      a.addEventListener("click",e=>{e.preventDefault();go(a.dataset.route);});
    });
  }

  /* ---------- 路由 ---------- */
  function go(route,param){
    state.route = route;
    if(route==="reader"){ /* 保持目前書卷章節 */ }
    if(param && param.book){state.readerBook=param.book;}
    if(param && param.chap){state.readerChap=param.chap;}
    location.hash = route;
    render();
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange",()=>{
    const h = location.hash.replace("#","")||"home";
    state.route = h.split("/")[0];
    if(h.indexOf("/")>-1){
      const parts = h.split("/");
      if(state.route==="reader" && parts[1]){state.readerBook=decodeURIComponent(parts[1]);if(parts[2])state.readerChap=+parts[2];}
      if(state.route==="articles" && parts[1]){renderArticle(decodeURIComponent(parts[1]));return;}
    }
    render();
    window.scrollTo(0,0);
  });

  /* ---------- 渲染總入口 ---------- */
  function render(){
    renderNav();
    const views = {home:renderHome,books:renderBooks,reader:renderReader,search:renderSearch,articles:renderArticles,golden:renderGolden,stats:renderStats,bookmarks:renderBookmarks};
    const fn = views[state.route]||renderHome;
    app.innerHTML = "";
    const el = fn();
    app.appendChild(el);
    if(state.route==="stats"){setTimeout(initCharts,50);}
  }

  /* ================= 首頁 ================= */
  function renderHome(){
    const sec = document.createElement("div");
    sec.className="view on";
    const totalChapters = ALL_BOOKS.reduce((s,b)=>s+b.ch,0);
    const groups = BOOK_GROUPS.map(g=>ALL_BOOKS.filter(b=>b.grp===g).length).reduce((a,b)=>a+b,0);
    sec.innerHTML = `
      <section class="hero">
        <svg class="orn" viewBox="0 0 24 24" fill="none" stroke="#f7f1e3" stroke-width="0.5"><path d="M12 5c-2-1.5-4.5-2-7-2v16c2.5 0 5 .5 7 2 2-1.5 4.5-2 7-2V3c-2.5 0-5 .5-7 2z"/><path d="M12 5v16"/></svg>
        <div class="hero-inner">
        <div class="kicker">上帝的話語 · 生命的糧</div>
        <h1>聖經Bible<br>聖經知識與功能網站</h1>
        <p class="sub">收錄舊約 39 卷、新約 27 卷共 66 卷完整書庫，提供章節閱讀、經文全文搜尋、每日金句、讀經計畫與主題文章——讓你在任何時刻，都能沉浸在上帝的話語裡。</p>
        <div class="stats">
          <div class="stat"><div class="num">66</div><div class="lbl">聖經書卷</div></div>
          <div class="stat"><div class="num">${totalChapters.toLocaleString()}</div><div class="lbl">聖經章節</div></div>
          <div class="stat"><div class="num">${VERSES.length}</div><div class="lbl">精選經文</div></div>
          <div class="stat"><div class="num">${ARTICLES.length}</div><div class="lbl">功能文章</div></div>
        </div>
        <div class="hero-actions">
          <button class="btn btn-gold" data-go="reader">開始讀聖經</button>
          <button class="btn btn-ghost" data-go="books">瀏覽 66 卷書庫</button>
          <button class="btn btn-ghost" data-go="golden">今日金句</button>
        </div>
        </div>
      </section>

      <section class="section">
        <h2 class="sec-title"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--crimson)" stroke-width="1.8" style="vertical-align:-3px;margin-right:8px"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>全卷書庫總覽</h2>
        <p class="sec-sub">舊約與新約六大書卷類別，快速前往研讀。</p>
        <div class="grid g4" id="homeGroups"></div>
      </section>

      <section class="section">
        <h2 class="sec-title">今日精選經文</h2>
        <p class="sec-sub">每天一句，讓上帝的話語成為你腳前的燈。</p>
        <div id="homeVerse" class="verse-block"></div>
      </section>

      <section class="section">
        <h2 class="sec-title">精選功能文章</h2>
        <p class="sec-sub">讀經方法、靈修默想與聖經主題，深化你的研讀。</p>
        <div class="grid g3" id="homeArticles"></div>
      </section>`;

    /* 全卷書庫總覽 - 依類別統計 */
    const gh = sec.querySelector("#homeGroups");
    gh.innerHTML = BOOK_GROUPS.map(g=>{
      const bs = ALL_BOOKS.filter(b=>b.grp===g);
      return `<div class="card" data-gotobooks="${g}">
        <div class="bnum">${g}</div>
        <h3>${bs.length} 卷</h3>
        <p>${bs.map(b=>b.name).join("、")}</p>
      </div>`;
    }).join("");
    gh.querySelectorAll("[data-gotobooks]").forEach(c=>{
      c.addEventListener("click",()=>{state.bookFilter=c.dataset.gotobooks;go("books");});
    });

    /* 今日經文 */
    const v = VERSES[Math.floor(Math.random()*VERSES.length)];
    sec.querySelector("#homeVerse").innerHTML = `
      <div class="ref">${esc(v.book)} ${esc(v.ref)}</div>
      <div class="txt">「${esc(v.text)}」</div>`;

    /* 精選文章 */
    const ha = sec.querySelector("#homeArticles");
    ha.innerHTML = ARTICLES.slice(0,3).map(a=>`
      <div class="card" data-article="${a.id}">
        <span class="tag gold">${a.cat}</span>
        <h3>${esc(a.title)}</h3>
        <p>${esc(a.excerpt)}</p>
      </div>`).join("");
    ha.querySelectorAll("[data-article]").forEach(c=>{
      c.addEventListener("click",()=>renderArticle(c.dataset.article));
    });

    /* 通用按鈕 */
    sec.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.go)));

    return sec;
  }

  /* ================= 書卷導覽 ================= */
  function renderBooks(){
    const sec = document.createElement("div");
    sec.className="view on";
    sec.innerHTML = `
      <h2 class="sec-title">聖經 66 卷書庫</h2>
      <p class="sec-sub">依類別瀏覽全卷聖經，點擊書卷查看導讀並進入章節閱讀。</p>
      <div class="book-filter" id="bf"></div>
      <div id="bookList"></div>`;

    const bf = sec.querySelector("#bf");
    bf.innerHTML = ["全部","舊約全書","新約全書",...BOOK_GROUPS].map(g=>{
      return `<button data-f="${g}" class="${state.bookFilter===g?"active":""}">${g}</button>`;
    }).join("");
    bf.querySelectorAll("button").forEach(b=>{
      b.addEventListener("click",()=>{state.bookFilter=b.dataset.f;renderBooks();renderNav();});
    });

    const bl = sec.querySelector("#bookList");
    let books = ALL_BOOKS;
    if(state.bookFilter==="舊約全書") books=OT;
    else if(state.bookFilter==="新約全書") books=NT;
    else if(state.bookFilter!=="全部") books=ALL_BOOKS.filter(b=>b.grp===state.bookFilter);

    // 依群組分組渲染
    const grouped = {};
    books.forEach(b=>{(grouped[b.grp]=grouped[b.grp]||[]).push(b);});
    let html = "";
    Object.keys(grouped).forEach(g=>{
      html += `<div class="book-group-title">${g}</div><div class="grid g4" style="margin-bottom:26px">`;
      html += grouped[g].map(b=>`
        <div class="card book-card" data-book="${b.name}">
          <div class="bnum">第 ${b.id} 卷 · ${b.ch} 章</div>
          <h3>${b.name}</h3>
          <div class="meta">${b.en}</div>
        </div>`).join("");
      html += `</div>`;
    });
    bl.innerHTML = html || `<div class="empty">無符合的書卷</div>`;
    bl.querySelectorAll("[data-book]").forEach(c=>c.addEventListener("click",()=>{
      const b = bookByName(c.dataset.book);
      showBookDetail(b);
    }));
    return sec;
  }

  /* 書卷詳情浮層 */
  function showBookDetail(b){
    const overlay = document.createElement("div");
    overlay.className="book-overlay";
    Object.assign(overlay.style,{position:"fixed",inset:0,background:"rgba(20,27,44,.55)",zIndex:100,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"});
    overlay.innerHTML = `
      <div class="book-modal" style="background:var(--card);border-radius:20px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:34px 38px;border:1px solid var(--line);box-shadow:var(--shadow)">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
          <div>
            <div class="bnum" style="color:var(--gold);font-weight:700;letter-spacing:.08em">第 ${b.id} 卷 · ${b.grp} · ${b.ch} 章</div>
            <h2 style="font-size:1.8rem;color:var(--navy)">${b.name} <span style="font-size:1rem;color:var(--ink-soft)">${b.en}</span></h2>
          </div>
          <button id="bmClose" style="background:none;border:none;font-size:1.6rem;color:var(--ink-soft);cursor:pointer;line-height:1">×</button>
        </div>
        <p><strong style="color:var(--navy)">作者：</strong>${b.author} ｜ <strong style="color:var(--navy)">年代：</strong>${b.era}</p>
        <p style="margin:10px 0"><strong style="color:var(--navy)">主題：</strong>${b.theme}</p>
        <div class="verse-block" style="margin-top:16px"><div class="ref">代表經文</div><div class="txt">「${esc(b.key)}」</div></div>
        <p style="margin-top:16px;color:var(--ink-soft)">${b.summary}</p>
        <div style="display:flex;gap:10px;margin-top:24px;flex-wrap:wrap">
          <button class="btn btn-navy" data-read="${b.name}" style="margin:0">開始閱讀本書</button>
          <button class="btn btn-line" id="bmBookmark" style="margin:0">＋ 加入書籤</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const close=()=>overlay.remove();
    overlay.addEventListener("click",e=>{if(e.target===overlay)close();});
    overlay.querySelector("#bmClose").addEventListener("click",close);
    overlay.querySelector("[data-read]").addEventListener("click",()=>{close();go("reader",{book:b.name,chap:1});});
    overlay.querySelector("#bmBookmark").addEventListener("click",()=>{
      const k=bmKey(b.name,1);
      if(!getBookmarks().some(x=>x.key===k)){getBookmarks().push({key:k,book:b.name,chap:1,ts:Date.now()});saveBookmarks();}
      close();renderBookmarks();
    });
  }

  /* ================= 章節閱讀 ================= */
  function renderReader(){
    const sec = document.createElement("div");
    sec.className="view on";
    const book = bookByName(state.readerBook)||ALL_BOOKS[0];
    sec.innerHTML = `
      <h2 class="sec-title">章節閱讀器</h2>
      <p class="sec-sub">選擇書卷與章節，沉浸式閱讀上帝的話語。</p>
      <div class="reader-picker">
        <div class="picker">
          <label>選擇書卷</label>
          <select id="rpBook"></select>
        </div>
        <div class="picker">
          <label>選擇章節</label>
          <select id="rpChap"></select>
        </div>
        <button class="btn btn-gold" id="rpGo" style="margin-top:22px">讀這一章</button>
      </div>
      <div class="reader" id="readerBox"></div>`;

    const bookSel = sec.querySelector("#rpBook");
    ALL_BOOKS.forEach(b=>{
      const o=document.createElement("option");o.value=b.name;o.textContent=`${b.name}（${b.ch}章）`;bookSel.appendChild(o);
    });
    bookSel.value = book.name;
    const chapSel = sec.querySelector("#rpChap");
    const fillChap=(bn)=>{
      chapSel.innerHTML="";
      const nb=bookByName(bn);for(let i=1;i<=nb.ch;i++){const o=document.createElement("option");o.value=i;o.textContent=`第 ${i} 章`;chapSel.appendChild(o);}
      chapSel.value=Math.min(state.readerChap||1,nb.ch);
    };
    fillChap(book.name);
    bookSel.addEventListener("change",()=>fillChap(bookSel.value));
    sec.querySelector("#rpGo").addEventListener("click",()=>{
      state.readerBook=bookSel.value;state.readerChap=+chapSel.value;
      drawReader(sec.querySelector("#readerBox"));
    });
    drawReader(sec.querySelector("#readerBox"));
    return sec;
  }

  /* 繪製讀經內容 */
  function drawReader(box){
    const b = bookByName(state.readerBook);
    if(!b){box.innerHTML="";return;}
    const chap = state.readerChap;
    const key="key" in b && chap===1 ? b.key : null;
    const isBm = getBookmarks().some(x=>x.key===bmKey(b.name,chap));
    box.innerHTML = `
      <div class="rhead">
        <div class="tname">${b.grp}</div>
        <div class="ref">${b.name} 第 ${chap} 章</div>
        <div style="font-size:.9rem;color:var(--ink-soft);margin-top:6px">作者：${b.author} · 主題：${b.theme}</div>
      </div>
      <div id="rVerses"></div>
      <div class="reader-nav">
        <button class="btn btn-line" id="rPrev">← 前一章</button>
        <button class="bookmark-btn ${isBm?"on":""}" id="rBm">${isBm?"★ 已收藏":"☆ 收藏本章"}</button>
        <button class="btn btn-line" id="rNext">後一章 →</button>
      </div>`;

    const vv = box.querySelector("#rVerses");
    // 逐節完整經文（和合本繁體公有領域）
    const txt = textFor(b.name, chap);
    if(txt){
      const headHtml = txt.head ? `<div class="rchaphead">${esc(txt.head)}</div>` : "";
      vv.innerHTML = headHtml + txt.verses.map(x=>
        `<div class="verse"><div class="vnum">${x.v}</div><div class="vtext">${esc(x.t)}</div></div>`
      ).join("");
    } else {
      // 資料缺漏時的備援：顯示代表經文＋導讀（保留原模板邏輯）
      if(chap===1 && b.key){
        vv.innerHTML = `<div class="verse"><div class="vnum">1</div><div class="vtext">${esc(b.key)}</div></div>
          <div style="margin-top:20px;padding:16px 20px;background:var(--parch);border-radius:12px;color:var(--ink-soft);font-size:.95rem"><strong>本章導讀：</strong>${b.summary}</div>`;
      } else {
        const themed = [b.key, b.theme, `這卷書（${b.name}）共有 ${b.ch} 章，作者為${b.author}，寫作年代約${b.era}。${b.summary}`];
        vv.innerHTML = themed.map((t,i)=>`
          <div class="verse"><div class="vnum">${i+1}</div><div class="vtext">${esc(t)}</div></div>`).join("");
      }
    }

    box.querySelector("#rPrev").addEventListener("click",()=>{
      if(chap>1){state.readerChap=chap-1;drawReader(box);}else{state.readerChap=b.ch;drawReader(box);}
    });
    box.querySelector("#rNext").addEventListener("click",()=>{
      if(chap<b.ch){state.readerChap=chap+1;drawReader(box);}else{state.readerChap=1;drawReader(box);}
    });
    box.querySelector("#rBm").addEventListener("click",()=>{
      const k=bmKey(b.name,chap);
      const idx=getBookmarks().findIndex(x=>x.key===k);
      if(idx>-1){getBookmarks().splice(idx,1);}
      else{getBookmarks().push({key:k,book:b.name,chap:chap,ts:Date.now()});}
      saveBookmarks();drawReader(box);
    });
  }

  /* ================= 經文搜尋 ================= */
  function renderSearch(){
    const sec=document.createElement("div");
    sec.className="view on";
    sec.innerHTML=`
      <h2 class="sec-title">經文與全文搜尋</h2>
      <p class="sec-sub">以關鍵字搜尋精選經文、書卷與功能文章。</p>
      <div class="search-box">
        <input id="si" type="text" placeholder="輸入關鍵字，例如：愛、信心、平安、憐憫…" value="${esc(state.searchQ)}">
        <button id="sb">搜尋</button>
      </div>
      <div id="sr"></div>`;
    const si=sec.querySelector("#si");const sr=sec.querySelector("#sr");
    const run=()=>{state.searchQ=si.value.trim();doSearch(state.searchQ,sr);};
    sec.querySelector("#sb").addEventListener("click",run);
    si.addEventListener("keydown",e=>{if(e.key==="Enter")run();});
    if(state.searchQ){si.value=state.searchQ;run();}
    else{doSearch("",sr);}
    return sec;
  }
  function doSearch(q,container){
    if(!q){container.innerHTML=`<div class="empty">輸入關鍵字開始搜尋。可搜尋：全庫經文、書卷名稱與功能文章。</div>`;return;}
    const ql=q.toLowerCase();
    const results=[];
    // 全庫經文（bible_text.js 31,021 節完整檢索）
    if(window.BIBLE_TEXT){
      let bibleHit=0;
      for(const code in window.BIBLE_TEXT){
        const bk=window.BIBLE_TEXT[code];
        (bk.chapters||[]).forEach((ch,ci)=>{
          if(!ch) return;
          ch.forEach(v=>{
            if(v.t && v.t.toLowerCase().includes(ql)){
              if(bibleHit<80){
                const bname=bk.name;
                results.push({type:"全庫經文",t:`${bname} ${ci+1}:${v.v}`,s:v.t,go:()=>go("reader",{book:bname,chap:ci+1})});
              }
              bibleHit++;
            }
          });
        });
      }
    }
    // 精選經文
    VERSES.forEach(v=>{
      if((v.book+v.ref+v.text).toLowerCase().includes(ql)){
        results.push({type:"精選經文",t:`${v.book} ${v.ref}`,s:v.text,go:()=>go("golden")});
      }
    });
    // 書卷
    ALL_BOOKS.forEach(b=>{
      if((b.name+b.en+b.theme+b.summary).toLowerCase().includes(ql)){
        results.push({type:"書卷",t:b.name,s:`${b.grp} · ${b.ch}章 · ${b.theme}`,go:()=>showBookDetail(b)});
      }
    });
    // 文章
    ARTICLES.forEach(a=>{
      if((a.title+a.excerpt+a.cat+a.body.join(" ")).toLowerCase().includes(ql)){
        results.push({type:"文章",t:a.title,s:a.excerpt,go:()=>renderArticle(a.id)});
      }
    });
    if(!results.length){container.innerHTML=`<div class="empty">找不到與「${esc(q)}」相關的內容。</div>`;return;}
    // 排序：全庫經文在前，其餘依原序
    results.sort((a,b)=>{
      const rank={全庫經文:0,精選經文:1,書卷:2,文章:3};
      return (rank[a.type]??9)-(rank[b.type]??9);
    });
    const typeColor={全庫經文:"gold",精選經文:"navy",書卷:"navy",文章:"crimson"};
    const totalHits = results.filter(r=>r.type==="全庫經文").length;
    const shown = results.slice(0,60);
    let head = `<div class="empty" style="margin-bottom:14px">找到 <strong>${totalHits}</strong> 節全庫經文${totalHits>80?"（顯示前 80 節，其餘請縮短關鍵字）":""}</div>`;
    if(!totalHits) head="";
    container.innerHTML = head + shown.map(r=>`
      <div class="result-item" data-idx="${shown.indexOf(r)}">
        <div class="rtype tag ${typeColor[r.type]}">${r.type}</div>
        <div class="rtitle">${esc(r.t)}</div>
        <div class="rsnip">${esc(r.s.length>80?r.s.slice(0,80)+"…":r.s)}</div>
      </div>`).join("");
    container.querySelectorAll(".result-item").forEach(el=>{
      el.addEventListener("click",()=>{const idx=+el.dataset.idx;const r=shown[idx];if(r&&r.go)r.go();});
    });
  }

  /* ================= 功能文章 ================= */
  function renderArticles(){
    const sec=document.createElement("div");
    sec.className="view on";
    const cats=["全部",...new Set(ARTICLES.map(a=>a.cat))];
    sec.innerHTML=`
      <h2 class="sec-title">功能文章</h2>
      <p class="sec-sub">讀經方法、靈修默想、聖經主題與背景研究，深化你與上帝的話語的關係。</p>
      <div class="book-filter" id="acat"></div>
      <div class="grid g3" id="alist"></div>`;
    const ac=sec.querySelector("#acat");
    ac.innerHTML=cats.map(c=>`<button data-c="${c}">${c}</button>`).join("");
    ac.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      ac.querySelectorAll("button").forEach(x=>x.classList.remove("active"));b.classList.add("active");
      const c=b.dataset.c;
      const list=(c==="全部"?ARTICLES:ARTICLES.filter(a=>a.cat===c));
      sec.querySelector("#alist").innerHTML=list.map(a=>`
        <div class="card article-card" data-a="${a.id}">
          <span class="tag gold">${a.cat}</span>
          <h3>${esc(a.title)}</h3>
          <div class="excerpt">${esc(a.excerpt)}</div>
        </div>`).join("");
      sec.querySelectorAll("[data-a]").forEach(el=>el.addEventListener("click",()=>renderArticle(el.dataset.a)));
    }));
    ac.querySelector("button").classList.add("active");
    const list=ARTICLES;
    sec.querySelector("#alist").innerHTML=list.map(a=>`
      <div class="card article-card" data-a="${a.id}">
        <span class="tag gold">${a.cat}</span>
        <h3>${esc(a.title)}</h3>
        <div class="excerpt">${esc(a.excerpt)}</div>
      </div>`).join("");
    sec.querySelectorAll("[data-a]").forEach(el=>el.addEventListener("click",()=>renderArticle(el.dataset.a)));
    return sec;
  }

  /* 文章內文 */
  function renderArticle(id){
    const a=ARTICLES.find(x=>x.id===id);
    if(!a){renderArticles();return;}
    state.route="articles";
    app.innerHTML="";
    const sec=document.createElement("div");
    sec.className="view on";
    sec.innerHTML=`
      <div style="margin-bottom:18px"><button class="btn btn-line" id="aback">← 返回文章列表</button></div>
      <article class="article-body">
        <span class="tag gold">${a.cat}</span>
        <h1>${esc(a.title)}</h1>
        <div class="ameta">${esc(a.excerpt)}</div>
        ${a.body.map(p=>`<p>${p}</p>`).join("")}
      </article>`;
    sec.querySelector("#aback").addEventListener("click",()=>{state.route="articles";location.hash="articles";render();});
    app.appendChild(sec);
    window.scrollTo(0,0);
  }

  /* ================= 每日金句 ================= */
  function renderGolden(){
    const sec=document.createElement("div");
    sec.className="view on";
    sec.innerHTML=`
      <h2 class="sec-title">每日金句</h2>
      <p class="sec-sub">依日期輪換精選經文，也可隨機抽取一句默想。</p>
      <div style="max-width:720px;margin:0 auto;text-align:center">
        <div id="goldenBox" class="reader" style="padding:44px 40px"></div>
        <button class="btn btn-gold" id="gNext" style="margin-top:20px">抽取下一句</button>
      </div>`;
    const box=sec.querySelector("#goldenBox");
    const draw=()=>{
      const idx=new Date().getDate()%VERSES.length;
      const v=VERSES[idx];
      box.innerHTML=`
        <div style="font-size:2.4rem;color:var(--gold);margin-bottom:10px">"</div>
        <div style="font-size:1.35rem;font-family:'Noto Serif TC',serif;color:var(--navy);line-height:1.8">「${esc(v.text)}」</div>
        <div style="margin-top:22px;color:var(--gold);font-weight:700;letter-spacing:.08em">${esc(v.book)} ${esc(v.ref)}</div>`;
    };
    draw();
    sec.querySelector("#gNext").addEventListener("click",()=>{
      const idx=Math.floor(Math.random()*VERSES.length);
      const v=VERSES[idx];
      box.innerHTML=`
        <div style="font-size:2.4rem;color:var(--gold);margin-bottom:10px">"</div>
        <div style="font-size:1.35rem;font-family:'Noto Serif TC',serif;color:var(--navy);line-height:1.8">「${esc(v.text)}」</div>
        <div style="margin-top:22px;color:var(--gold);font-weight:700;letter-spacing:.08em">${esc(v.book)} ${esc(v.ref)}</div>`;
    });
    return sec;
  }

  /* ================= 統計圖表 ================= */
  function renderStats(){
    const sec=document.createElement("div");
    sec.className="view on";
    const otCh=OT.reduce((s,b)=>s+b.ch,0), ntCh=NT.reduce((s,b)=>s+b.ch,0);
    const total=otCh+ntCh;
    sec.innerHTML=`
      <h2 class="sec-title">聖經數據統計</h2>
      <p class="sec-sub">以視覺化呈現聖經書卷結構、章節分布與主題。</p>
      <div class="grid g2">
        <div class="chart-card"><h3>新舊約章節占比</h3><p>舊約 ${otCh} 章（${Math.round(otCh/total*100)}%）｜新約 ${ntCh} 章（${Math.round(ntCh/total*100)}%）</p><div id="cPie" class="chart-box"></div></div>
        <div class="chart-card"><h3>十大書卷類別章數</h3><p>各類別包含的章節總數</p><div id="cBar" class="chart-box"></div></div>
        <div class="chart-card"><h3>各卷章數分布</h3><p>66 卷書的章數（依卷序）</p><div id="cLine" class="chart-box"></div></div>
        <div class="chart-card"><h3>書卷數量分類</h3><p>各類別包含的書卷數</p><div id="cDonut" class="chart-box"></div></div>
      </div>`;
    return sec;
  }
  function initCharts(){
    if(typeof echarts==="undefined"){return;}
    const otCh=OT.reduce((s,b)=>s+b.ch,0),ntCh=NT.reduce((s,b)=>s+b.ch,0);
    const pie=echarts.init(document.getElementById("cPie"));
    pie.setOption({
      tooltip:{trigger:"item",formatter:"{b}：{c} 章（{d}%）"},
      series:[{type:"pie",radius:["45%","72%"],avoidLabelOverlap:true,label:{color:"#1f2a44"},itemStyle:{borderColor:"#f7f1e3",borderWidth:2},
        data:[{value:otCh,name:"舊約",itemStyle:{color:"#2e3d63"}},{value:ntCh,name:"新約",itemStyle:{color:"#b58a3c"}}]}]
    });
    const bar=echarts.init(document.getElementById("cBar"));
    const cats=BOOK_GROUPS.map(g=>g);
    const catCh=cats.map(g=>ALL_BOOKS.filter(b=>b.grp===g).reduce((s,b)=>s+b.ch,0));
    bar.setOption({
      tooltip:{trigger:"axis"},grid:{left:60,right:20,top:20,bottom:40},
      xAxis:{type:"category",data:cats,axisLabel:{rotate:30,color:"#5b6b7c"}},
      yAxis:{type:"value",name:"章數",axisLabel:{color:"#5b6b7c"}},
      series:[{type:"bar",data:catCh,itemStyle:{color:"#2e3d63",borderRadius:[6,6,0,0]},barWidth:"58%"}]
    });
    const line=echarts.init(document.getElementById("cLine"));
    const names=ALL_BOOKS.map(b=>b.name);
    const chs=ALL_BOOKS.map(b=>b.ch);
    line.setOption({
      tooltip:{trigger:"axis"},grid:{left:40,right:20,top:20,bottom:60},
      xAxis:{type:"category",data:names,axisLabel:{interval:10,color:"#5b6b7c"}},
      yAxis:{type:"value",name:"章數",axisLabel:{color:"#5b6b7c"}},
      series:[{type:"line",data:chs,smooth:true,symbol:"none",lineStyle:{color:"#b58a3c",width:2},areaStyle:{color:"rgba(181,138,60,.12)"}}]
    });
    const donut=echarts.init(document.getElementById("cDonut"));
    const catCount=cats.map(g=>ALL_BOOKS.filter(b=>b.grp===g).length);
    donut.setOption({
      tooltip:{trigger:"item",formatter:"{b}：{c} 卷（{d}%）"},
      series:[{type:"pie",radius:["40%","68%"],center:["50%","50%"],label:{color:"#1f2a44"},itemStyle:{borderColor:"#f7f1e3",borderWidth:2},
        data:cats.map((g,i)=>({name:g,value:catCount[i]}))}]
    });
    window.addEventListener("resize",()=>{[pie,bar,line,donut].forEach(c=>c.resize());});
  }

  /* ================= 我的書籤 ================= */
  function renderBookmarks(){
    const sec=document.createElement("div");
    sec.className="view on";
    sec.innerHTML=`
      <h2 class="sec-title">我的書籤</h2>
      <p class="sec-sub">收藏的書卷與章節，儲存在此瀏覽器中。</p>
      <div class="bm-list" id="bmlist"></div>`;
    const bml=sec.querySelector("#bmlist");
    const bm=getBookmarks().slice().sort((a,b)=>b.ts-a.ts);
    if(!bm.length){bml.innerHTML=`<div class="empty">尚無書籤。在章節閱讀器中點「收藏本章」即可加入。</div>`;return sec;}
    bml.innerHTML=bm.map((x,i)=>`
      <div class="bm-item">
        <div>
          <div class="bmtitle">${x.book} 第 ${x.ch} 章</div>
          <div class="bmmeta">${new Date(x.ts).toLocaleDateString("zh-TW")} 收藏</div>
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-navy" data-open="${i}" style="margin:0;padding:7px 14px;font-size:.86rem">閱讀</button>
          <button data-del="${i}" style="margin:0">移除</button>
        </div>
      </div>`).join("");
    bml.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",()=>{
      const x=bm[+el.dataset.open];go("reader",{book:x.book,chap:x.chap});
    }));
    bml.querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click",()=>{
      const x=bm[+el.dataset.del];
      const idx=getBookmarks().findIndex(y=>y.key===x.key);
      if(idx>-1)getBookmarks().splice(idx,1);saveBookmarks();renderBookmarks();
    }));
    return sec;
  }

  /* ---------- 頂欄搜尋 ---------- */
  function bindNavSearch(){
    const inp=$("navSearchInput"),btn=$("navSearchBtn");
    const run=()=>{const q=inp.value.trim();if(q){state.searchQ=q;state.route="search";location.hash="search";render();inp.blur();}};
    btn.addEventListener("click",run);
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")run();});
  }

  /* ---------- 啟動 ---------- */
  renderNav();
  bindNavSearch();
  render();
})();
</script>
